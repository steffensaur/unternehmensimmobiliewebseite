<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marktplatz — Die Unternehmensimmobilie</title>
<meta name="description" content="Live-Marktplatz für Industrie- und Logistikimmobilien. KI-bewertet, direkt vom Eigentümer, kein Makler.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<style>
:root{
  --ink:#080C10;--ink2:#0E141C;--ink3:#151E28;--ink4:#1C2735;
  --cyan:#00E5C8;--cyan2:#00B89E;--cbrd:rgba(0,229,200,.22);--cdim:rgba(0,229,200,.09);
  --w:#fff;--w60:rgba(255,255,255,.6);--w35:rgba(255,255,255,.35);--w08:rgba(255,255,255,.08);
  --red:#EF4444;--amber:#F59E0B;--grid:rgba(255,255,255,.035);
  --nav:56px;--filter:52px;--top:108px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{background:var(--ink);color:var(--w);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden;height:100vh}
a{text-decoration:none;color:inherit}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--nav);background:rgba(8,12,16,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--w08);display:flex;align-items:center;padding:0 1.5rem;gap:1.25rem}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}
.lm{width:28px;height:28px;background:var(--cyan);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--ink)}
.lt{font-size:12px;font-weight:500;color:var(--w)}
.ls{font-size:7.5px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.nav-links{display:flex;gap:1.25rem;margin-left:1rem}
.nav-links a{font-size:12px;color:var(--w35);transition:color .2s}
.nav-links a:hover,.nav-links a.cur{color:var(--cyan)}
.search-box{position:relative;margin-left:auto}
.search-input{background:var(--ink3);border:1px solid var(--w08);border-radius:6px;padding:6px 12px 6px 32px;font-size:12px;color:var(--w);width:220px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,width .3s}
.search-input::placeholder{color:var(--w35)}
.search-input:focus{border-color:var(--cbrd);width:280px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--w35);font-size:13px;pointer-events:none}
.nav-btn{background:var(--cyan);color:var(--ink);padding:7px 16px;border-radius:5px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);display:inline-block;animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,200,.5)}50%{box-shadow:0 0 0 5px rgba(0,229,200,0)}}

/* ── FILTER BAR ── */
.fbar{position:fixed;top:var(--nav);left:0;right:0;z-index:200;height:var(--filter);background:var(--ink2);border-bottom:1px solid var(--w08);display:flex;align-items:center;padding:0 1.5rem;gap:8px;overflow-x:auto}
.fbar::-webkit-scrollbar{display:none}
.flabel{font-size:9px;font-weight:500;color:var(--w35);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.chip{background:none;border:1px solid var(--w08);color:var(--w60);padding:4px 11px;border-radius:20px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--w35);color:var(--w)}
.chip.on{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.chip.on:hover{background:var(--cyan2)}
.fdiv{width:1px;height:16px;background:var(--w08);flex-shrink:0;margin:0 2px}
.sort-sel{background:var(--ink3);border:1px solid var(--w08);color:var(--w60);padding:4px 10px;border-radius:5px;font-size:11px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
.vtoggle{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.vtb{padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--w08);color:var(--w35);background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.vtb.on{background:var(--cdim);color:var(--cyan);border-color:var(--cbrd)}
.count-lbl{font-size:11px;color:var(--w35);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}

/* ── MAIN ── */
.main{position:fixed;top:var(--top);left:0;right:0;bottom:0;display:grid;grid-template-columns:380px 1fr}

/* ── SIDEBAR ── */
.sb{overflow-y:auto;border-right:1px solid var(--w08);background:var(--ink2);display:flex;flex-direction:column}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}
.sb-head{padding:12px 14px;border-bottom:1px solid var(--w08);position:sticky;top:0;background:var(--ink2);z-index:10;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-title{font-size:11px;font-weight:500}
.sb-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--w35)}
.prop-list{flex:1}

/* prop row */
.prow{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;display:flex;gap:10px}
.prow:hover{background:rgba(255,255,255,.025)}
.prow.sel{background:rgba(0,229,200,.05);border-left:2px solid var(--cyan);padding-left:12px}
.thumb{width:64px;height:52px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--ink4)}
.pinfo{flex:1;min-width:0}
.pname{font-size:11.5px;font-weight:500;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ploc{font-size:9.5px;color:var(--w35);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.pmr{display:flex;gap:8px;margin-bottom:5px}
.pm{font-size:9.5px;color:var(--w60)}
.pm strong{color:var(--w);font-weight:500}
.ppr{display:flex;align-items:center;justify-content:space-between}
.pprice{font-family:'DM Mono',monospace;font-size:12px;color:var(--cyan)}
.ptag{font-size:8px;font-weight:500;padding:2px 6px;border-radius:8px}
.tag-sell{background:var(--cyan);color:var(--ink)}
.tag-rent{background:rgba(255,255,255,.1);color:var(--w60)}
.tag-nego{background:rgba(245,158,11,.18);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.tag-req{background:var(--cdim);color:var(--cyan);border:1px solid var(--cbrd)}

/* ── MAP ── */
.map-wrap{position:relative;background:#091219;overflow:hidden}
#leaflet-map{width:100%;height:100%}

/* Leaflet dark overrides */
.leaflet-tile-pane{filter:brightness(.85) saturate(.7) hue-rotate(180deg) invert(1) hue-rotate(180deg)}
.leaflet-control-attribution{background:rgba(8,12,16,.8)!important;color:rgba(255,255,255,.35)!important;font-size:9px!important}
.leaflet-control-attribution a{color:rgba(0,229,200,.5)!important}
.leaflet-control-zoom a{background:var(--ink3)!important;color:var(--w)!important;border-color:var(--w08)!important}
.leaflet-control-zoom a:hover{background:var(--ink4)!important;color:var(--cyan)!important}

/* Custom marker popup */
.leaflet-popup-content-wrapper{background:var(--ink3);border:1px solid var(--cbrd);border-radius:8px;color:var(--w);box-shadow:0 8px 32px rgba(0,0,0,.5);padding:0}
.leaflet-popup-content{margin:0;padding:0;font-family:'DM Sans',sans-serif}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{color:var(--w35)!important;font-size:16px!important;padding:6px 10px!important}
.leaflet-popup-close-button:hover{color:var(--w)!important}
.pop-inner{padding:14px;min-width:220px}
.pop-tag{font-size:8.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.pop-name{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--w);line-height:1.3}
.pop-loc{font-size:10px;color:var(--w60);margin-bottom:8px}
.pop-price{font-family:'DM Mono',monospace;font-size:16px;color:var(--cyan);margin-bottom:6px}
.pop-metrics{display:flex;gap:10px;margin-bottom:10px}
.pop-m{font-size:10px;color:var(--w60)}.pop-m strong{color:var(--w);display:block;font-size:11px}
.pop-btn{width:100%;background:var(--cyan);color:var(--ink);border:none;border-radius:5px;padding:8px;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}

/* cluster tooltip */
.tip{position:absolute;background:rgba(8,12,16,.92);border:1px solid var(--cbrd);border-radius:6px;padding:6px 10px;font-size:10px;color:var(--w);pointer-events:none;z-index:50;display:none;max-width:200px;line-height:1.5;backdrop-filter:blur(8px)}

/* ── DETAIL PANEL (slide-in) ── */
.detail{position:absolute;bottom:0;right:0;width:340px;background:var(--ink3);border-top:1px solid var(--cbrd);border-left:1px solid var(--cbrd);border-radius:10px 0 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1);z-index:100;max-height:85%;overflow-y:auto;box-shadow:-8px -8px 40px rgba(0,0,0,.5)}
.detail.open{transform:translateY(0)}
.detail::-webkit-scrollbar{width:3px}
.detail::-webkit-scrollbar-thumb{background:var(--w08)}
.det-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--w35);cursor:pointer;font-size:20px;line-height:1;z-index:1}
.det-img{height:140px;background:var(--ink4);position:relative;overflow:hidden}
.det-img-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 20px),repeating-linear-gradient(90deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 20px)}
.det-body{padding:16px}
.det-eyebrow{font-size:8.5px;color:var(--w35);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.det-name{font-size:16px;font-weight:500;margin-bottom:4px;line-height:1.3}
.det-loc{font-size:11px;color:var(--w60);margin-bottom:12px;display:flex;align-items:center;gap:5px}
.det-price{font-family:'DM Mono',monospace;font-size:26px;color:var(--cyan);line-height:1;margin-bottom:3px}
.det-price-sub{font-size:10px;color:var(--w35);margin-bottom:14px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.det-cell{padding:8px 10px;background:var(--ink4);border-radius:6px}
.det-cell-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--w)}
.det-cell-lbl{font-size:8.5px;color:var(--w35);margin-top:2px}
.det-desc{font-size:12px;color:var(--w60);line-height:1.65;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--w08)}
.det-feats{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.det-feat{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--w60)}
.det-feat::before{content:'✓';color:var(--cyan);font-weight:500;flex-shrink:0}
.det-btn{width:100%;background:var(--cyan);color:var(--ink);border:none;border-radius:6px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:7px}
.det-btn-g{width:100%;background:var(--cdim);color:var(--cyan);border:1px solid var(--cbrd);border-radius:6px;padding:9px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.det-footer{margin-top:10px;padding-top:10px;border-top:1px solid var(--w08);display:flex;align-items:center;gap:8px}
.det-agent{width:28px;height:28px;border-radius:50%;background:var(--cdim);border:1px solid var(--cbrd);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--cyan);flex-shrink:0}
.det-agent-name{font-size:11px;font-weight:500}
.det-agent-role{font-size:9.5px;color:var(--w35)}

/* ── LIST VIEW ── */
.list-view{position:absolute;inset:0;overflow-y:auto;padding:1.25rem 1.5rem;background:var(--ink);display:none;grid-column:1/-1}
.list-view.on{display:block}
.list-view::-webkit-scrollbar{width:4px}
.list-view::-webkit-scrollbar-thumb{background:var(--w08);border-radius:2px}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lcard{background:var(--ink3);border:1px solid var(--w08);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s}
.lcard:hover{border-color:var(--cbrd);transform:translateY(-2px)}
.lcard-img{height:110px;background:var(--ink4);position:relative;overflow:hidden}
.lcard-body{padding:12px}
.lcard-footer{border-top:1px solid var(--w08);padding:9px 12px;display:flex;align-items:center;justify-content:space-between}
.btn-xs{background:var(--cyan);color:var(--ink);border:none;border-radius:4px;padding:4px 10px;font-size:10px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}

/* empty state */
.empty{padding:3rem;text-align:center;color:var(--w35);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:12px}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .sb{display:none}
  nav .nav-links{display:none}
  .search-input{width:160px}
  .search-input:focus{width:200px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="landingpage_v2_journey.html" class="logo">
    <div class="lm">UI</div>
    <div><div class="lt">Die Unternehmensimmobilie</div><div class="ls">Logistik · Industrie · Gewerbe</div></div>
  </a>
  <div class="nav-links">
    <a href="landingpage_v2_journey.html">Startseite</a>
    <a href="marketplace.html" class="cur">Marktplatz</a>
    <a href="landingpage_v2_journey.html#pricing">Preise</a>
    <a href="landingpage_v2_journey.html#step1">Bewertung</a>
  </div>
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="search" type="text" placeholder="Stadt, PLZ oder Objektname …" oninput="doSearch(this.value)">

</nav>

<!-- FILTER BAR -->
<div class="fbar">
  <span class="flabel">Typ</span>
  <button class="chip on" data-g="typ" data-v="alle" onclick="filt(this)">Alle</button>
  <button class="chip" data-g="typ" data-v="logistik" onclick="filt(this)">Logistik</button>
  <button class="chip" data-g="typ" data-v="produktion" onclick="filt(this)">Produktion</button>
  <button class="chip" data-g="typ" data-v="industrie" onclick="filt(this)">Industrie</button>
  <button class="chip" data-g="typ" data-v="kuehllager" onclick="filt(this)">Kühllager</button>
  <div class="fdiv"></div>
  <span class="flabel">Status</span>
  <button class="chip on" data-g="status" data-v="alle" onclick="filt(this)">Alle</button>
  <button class="chip" data-g="status" data-v="Verkauf" onclick="filt(this)">Verkauf</button>
  <button class="chip" data-g="status" data-v="Miete" onclick="filt(this)">Miete</button>
  <button class="chip" data-g="status" data-v="Verhandlung" onclick="filt(this)">Verhandlung</button>
  <div class="fdiv"></div>
  <span class="flabel">Preis</span>
  <button class="chip on" data-g="preis" data-v="alle" onclick="filt(this)">Alle</button>
  <button class="chip" data-g="preis" data-v="u10" onclick="filt(this)">bis 10 Mio.</button>
  <button class="chip" data-g="preis" data-v="10-30" onclick="filt(this)">10–30 Mio.</button>
  <button class="chip" data-g="preis" data-v="ue30" onclick="filt(this)">über 30 Mio.</button>
  <div class="fdiv"></div>
  <select class="sort-sel" onchange="doSort(this.value)">
    <option value="default">Sortierung: Relevanz</option>
    <option value="price-asc">Preis aufsteigend</option>
    <option value="price-desc">Preis absteigend</option>
    <option value="sqm-desc">Fläche (groß → klein)</option>
    <option value="year-desc">Neueste zuerst</option>
  </select>
  <div class="fdiv"></div>
  <span class="count-lbl"><span class="live-dot"></span><span id="cnt">16</span> Objekte</span>
  <div class="vtoggle">
    <button class="vtb on" id="v-map" onclick="setView('map')">🗺 Karte</button>
    <button class="vtb" id="v-list" onclick="setView('list')">⊞ Liste</button>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <!-- SIDEBAR -->
  <div class="sb">
    <div class="sb-head">
      <span class="sb-title">Aktuelle Objekte</span>
      <span class="sb-count" id="sb-cnt">16 verfügbar</span>
    </div>
    <div class="prop-list" id="prop-list"></div>
  </div>

  <!-- MAP -->
  <div class="map-wrap" id="map-wrap">
    <div id="leaflet-map"></div>
    <div class="tip" id="tip"></div>

    <!-- Detail panel -->
    <div class="detail" id="detail">
      <button class="det-close" onclick="closeDetail()">×</button>
      <div class="det-img" id="det-img">
        <div class="det-img-grid"></div>
        <div id="det-img-icon" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.35"></div>
        <div id="det-tag" style="position:absolute;bottom:10px;left:10px"></div>
      </div>
      <div class="det-body">
        <div class="det-eyebrow" id="det-type">—</div>
        <div class="det-name" id="det-name">—</div>
        <div class="det-loc" id="det-loc">—</div>
        <div class="det-price" id="det-price">—</div>
        <div class="det-price-sub" id="det-psub">—</div>
        <div class="det-grid" id="det-grid"></div>
        <div class="det-desc" id="det-desc">—</div>
        <div class="det-feats" id="det-feats"></div>
        <button class="det-btn">Exposé anfordern →</button>
        <button class="det-btn-g">Besichtigung vereinbaren</button>
        <div class="det-footer">
          <div class="det-agent" id="det-av">MS</div>
          <div><div class="det-agent-name" id="det-aname">Markus Schäfer</div><div class="det-agent-role">Senior Transaktionsberater</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div class="list-view" id="list-view">
    <div class="list-grid" id="list-grid"></div>
  </div>

</div><!-- /main -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
