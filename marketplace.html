<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marktplatz — Die Unternehmensimmobilie</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080C10;--ink2:#0E141C;--ink3:#151E28;--ink4:#1C2735;--ink5:#243040;
  --cyan:#00E5C8;--cyan2:#00B89E;
  --cdim:rgba(0,229,200,.1);--cbrd:rgba(0,229,200,.22);
  --w:#fff;--w60:rgba(255,255,255,.6);--w35:rgba(255,255,255,.35);
  --w15:rgba(255,255,255,.15);--w08:rgba(255,255,255,.08);
  --red:#EF4444;--amber:#F59E0B;
  --grid:rgba(255,255,255,.038);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--w);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.65;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.grid-bg{background-image:repeating-linear-gradient(0deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 40px),repeating-linear-gradient(90deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 40px)}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:56px;background:rgba(8,12,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--w08);display:flex;align-items:center;padding:0 2rem;gap:1.5rem}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.lm{width:28px;height:28px;background:var(--cyan);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--ink)}
.lt{font-size:12px;font-weight:500}
.ls{font-size:7.5px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.nav-links{display:flex;gap:1.5rem;margin-left:auto}
.nav-links a{font-size:12px;color:var(--w35);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--cyan)}
.btn-sm-nav{background:var(--cyan);color:var(--ink);padding:6px 16px;border-radius:4px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ── LIVE DOT ── */
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);display:inline-block;animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,200,.5)}50%{box-shadow:0 0 0 5px rgba(0,229,200,0)}}

/* ── FILTER BAR ── */
.filter-bar{padding:0 2rem;height:52px;background:var(--ink2);border-bottom:1px solid var(--w08);display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;position:sticky;top:56px;z-index:100}
.filter-label{font-size:9px;font-weight:500;color:var(--w35);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.chip{background:none;border:1px solid var(--w08);color:var(--w60);padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0}
.chip:hover,.chip.active{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.fdiv{width:1px;height:16px;background:var(--w08);flex-shrink:0}
.view-toggle{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.vtb{padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--w08);color:var(--w35);background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.vtb.active{background:var(--cdim);color:var(--cyan);border-color:var(--cbrd)}

/* ── MAIN LAYOUT ── */
.mp-layout{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 108px);overflow:hidden;position:sticky;top:108px}

/* ── SIDEBAR ── */
.sidebar{overflow-y:auto;border-right:1px solid var(--w08);background:var(--ink2)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--w08);border-radius:2px}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--w08);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--ink2);z-index:10}
.sidebar-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--w35)}

/* Property list item */
.prop-item{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .15s;display:flex;gap:12px;align-items:flex-start}
.prop-item:hover{background:rgba(255,255,255,.02)}
.prop-item.selected{background:rgba(0,229,200,.05);border-left:2px solid var(--cyan)}
.prop-thumb{width:68px;height:56px;border-radius:6px;background:var(--ink4);flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.prop-thumb-svg{width:100%;height:100%}
.prop-info{flex:1;min-width:0}
.prop-name{font-size:12px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-loc{font-size:10px;color:var(--w35);margin-bottom:6px}
.prop-metrics-row{display:flex;gap:8px}
.prop-metric{font-size:9.5px;color:var(--w60)}
.prop-metric strong{color:var(--w);font-weight:500}
.prop-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.prop-price{font-family:'DM Mono',monospace;font-size:13px;color:var(--cyan)}
.prop-delta{font-size:9px;padding:1px 6px;border-radius:8px}
.delta-up{color:var(--cyan);background:rgba(0,229,200,.1)}
.delta-dn{color:var(--red);background:rgba(239,68,68,.1)}

/* ── MAP ── */
.map-panel{position:relative;background:#0A1420;overflow:hidden}
.map-svg{width:100%;height:100%}

/* ── DETAIL PANEL ── */
.detail-panel{position:absolute;bottom:20px;right:20px;width:300px;background:var(--ink3);border:1px solid var(--cbrd);border-radius:10px;overflow:hidden;transform:translateY(120%);transition:transform .3s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.detail-panel.open{transform:translateY(0)}
.detail-header{background:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--w08);display:flex;align-items:center;justify-content:space-between}
.detail-close{background:none;border:none;color:var(--w35);cursor:pointer;font-size:18px;line-height:1}
.detail-body{padding:14px}
.detail-price{font-family:'DM Mono',monospace;font-size:24px;color:var(--cyan);font-weight:500;margin:8px 0 4px}
.detail-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.dm-cell{padding:8px;background:var(--ink4);border-radius:5px;text-align:center}
.dm-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--w)}
.dm-lbl{font-size:8.5px;color:var(--w35);margin-top:2px}
.detail-btn{width:100%;background:var(--cyan);color:var(--ink);border:none;border-radius:5px;padding:10px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}
.detail-btn-ghost{width:100%;background:var(--cdim);color:var(--cyan);border:1px solid var(--cbrd);border-radius:5px;padding:8px;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}

/* Tag */
.tag{display:inline-flex;align-items:center;font-size:8.5px;font-weight:500;padding:2px 8px;border-radius:10px;letter-spacing:.04em}
.tag-sell{background:var(--cyan);color:var(--ink)}
.tag-rent{background:rgba(255,255,255,.1);color:var(--w60)}
.tag-nego{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.25)}

/* ── LIST VIEW ── */
.list-view{display:none;padding:1.5rem 2rem;overflow-y:auto;height:calc(100vh - 108px);background:var(--ink)}
.list-view.active{display:block}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.lcard{background:var(--ink3);border:1px solid var(--w08);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.lcard:hover{border-color:var(--cbrd)}
.lcard-img{height:120px;background:var(--ink4);position:relative;overflow:hidden}
.lcard-body{padding:14px}
.lcard-footer{border-top:1px solid var(--w08);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.btn-xs{background:var(--cyan);color:var(--ink);border:none;border-radius:3px;padding:4px 10px;font-size:9.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>

<script>
// ── DATA ──────────────────────────────────────────
const PROPS = [
  {id:0,name:'Logistikzentrum A9-Corridor',loc:'München, Bayern',sqm:'89.500',year:2019,h:'11 m',price:'€ 38,5 Mio.',delta:'+2,4 %',dc:'var(--cyan)',status:'Verkauf',typ:'logistik',preis:'ue30',pinId:'mpin-0'},
  {id:1,name:'Kühllagerkomplex Hafen',loc:'Hamburg, HH',sqm:'14.600',year:2021,h:'12 m',price:'€ 21,0 Mio.',delta:'+4,7 %',dc:'var(--cyan)',status:'Verkauf',typ:'kuehllager',preis:'10-30',pinId:'mpin-1'},
  {id:2,name:'Automatisiertes Hochregallager',loc:'Dortmund, NRW',sqm:'31.200',year:2023,h:'18 m',price:'6,40 €/m²',delta:'Frei',dc:'rgba(255,255,255,.5)',status:'Miete',typ:'logistik',preis:'u10',pinId:'mpin-2'},
  {id:3,name:'Industriehalle Ruhrgebiet',loc:'Essen, NRW',sqm:'18.400',year:2006,h:'9 m',price:'€ 12,8 Mio.',delta:'−1,1 %',dc:'var(--red)',status:'Verkauf',typ:'industrie',preis:'10-30',pinId:'mpin-3'},
  {id:4,name:'Cross-Docking Terminal FRA',loc:'Frankfurt, Hessen',sqm:'22.000',year:2014,h:'10 m',price:'€ 17,2 Mio.',delta:'Verh.',dc:'var(--amber)',status:'Verhandlung',typ:'produktion',preis:'10-30',pinId:'mpin-4'},

  {id:6,name:'Distributionszentrum Leipzig',loc:'Leipzig, Sachsen',sqm:'12.800',year:2016,h:'9 m',price:'€ 9,6 Mio.',delta:'+3,1 %',dc:'var(--cyan)',status:'Verkauf',typ:'logistik',preis:'u10',pinId:'mpin-6'},
  {id:7,name:'Produktionshalle Nürnberg',loc:'Nürnberg, Bayern',sqm:'21.500',year:2011,h:'10 m',price:'€ 15,3 Mio.',delta:'+0,9 %',dc:'var(--cyan)',status:'Verkauf',typ:'produktion',preis:'10-30',pinId:'mpin-7'},
  {id:8,name:'Logistikhub Berlin-Ost',loc:'Berlin',sqm:'38.000',year:2020,h:'12 m',price:'€ 22,1 Mio.',delta:'+5,2 %',dc:'var(--cyan)',status:'Verkauf',typ:'logistik',preis:'10-30',pinId:'mpin-8'},
  {id:9,name:'Gewerbeobjekt Köln-Deutz',loc:'Köln, NRW',sqm:'8.200',year:2009,h:'7 m',price:'€ 7,8 Mio.',delta:'+1,2 %',dc:'var(--cyan)',status:'Verkauf',typ:'industrie',preis:'u10',pinId:'mpin-9'},
  {id:10,name:'Industriepark Dresden-Nord',loc:'Dresden, Sachsen',sqm:'16.400',year:2013,h:'11 m',price:'€ 11,2 Mio.',delta:'+2,7 %',dc:'var(--cyan)',status:'Verkauf',typ:'industrie',preis:'10-30',pinId:'mpin-10'},
  {id:11,name:'Kühllager Hannover-Linden',loc:'Hannover, Nds.',sqm:'9.800',year:2017,h:'8 m',price:'5,20 €/m²',delta:'Frei',dc:'rgba(255,255,255,.5)',status:'Miete',typ:'kuehllager',preis:'u10',pinId:'mpin-11'},
  {id:12,name:'Produktionshalle Coswig A9',loc:'Coswig (Anhalt), Sachsen-Anhalt',sqm:'4.177',year:1994,h:'8,5 m',price:'Auf Anfrage',delta:'15 €/m² BRW',dc:'rgba(255,255,255,.5)',status:'Verkauf',typ:'produktion',preis:'u10',pinId:'mpin-12'},
  {id:13,name:'Logistikhalle Duisburg Hafen',loc:'Duisburg, NRW',sqm:'22.600',year:2008,h:'10 m',price:'4,80 €/m²',delta:'Frei',dc:'rgba(255,255,255,.5)',status:'Miete',typ:'logistik',preis:'u10',pinId:'mpin-13'},
  {id:14,name:'Gewerbepark Mannheim-Süd',loc:'Mannheim, BW',sqm:'11.400',year:2005,h:'8 m',price:'€ 8,9 Mio.',delta:'+0,5 %',dc:'var(--cyan)',status:'Verkauf',typ:'industrie',preis:'u10',pinId:'mpin-14'},
  {id:15,name:'Lager- & Produktionshalle Augsburg',loc:'Augsburg, Bayern',sqm:'7.600',year:2012,h:'9 m',price:'€ 6,2 Mio.',delta:'+1,9 %',dc:'var(--cyan)',status:'Verkauf',typ:'produktion',preis:'u10',pinId:'mpin-15'},
];

const filterState = {typ:'alle', preis:'alle'};
let activeProp = null;

// Tag HTML helper
function tagHtml(s){
  if(s==='Verkauf') return '<span class="tag tag-sell">Verkauf</span>';
  if(s==='Miete') return '<span class="tag tag-rent">Miete</span>';
  if(s==='Verhandlung') return '<span class="tag tag-nego">In Verhandlung</span>';
  return `<span class="tag" style="background:rgba(0,229,200,.1);color:var(--cyan)">${s}</span>`;
}

// Thumbnail SVG per type
function thumbSvg(typ){
  const col = typ==='kuehllager'?'#00A8F0':typ==='produktion'?'#8B7FCC':'#00E5C8';
  return `<svg viewBox="0 0 68 56" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <rect width="68" height="56" fill="#1C2735"/>
    <rect x="4" y="32" width="60" height="20" fill="${col}" opacity=".15"/>
    <polygon points="4,32 18,14 32,32" fill="${col}" opacity=".7"/>
    <polygon points="26,32 40,14 54,32" fill="${col}" opacity=".45"/>
    <polygon points="48,32 58,14 64,32" fill="${col}" opacity=".22"/>
    <rect x="8" y="40" width="12" height="12" fill="#080C10" opacity=".8"/>
    <rect x="28" y="40" width="12" height="12" fill="#080C10" opacity=".8"/>
    <rect x="48" y="40" width="12" height="12" fill="#080C10" opacity=".8"/>
    <rect x="0" y="52" width="68" height="2" fill="${col}" opacity=".5"/>
  </svg>`;
}

// Render sidebar list
function renderList(props){
  const el = document.getElementById('prop-list');
  el.innerHTML = props.length === 0
    ? '<div style="padding:24px;text-align:center;font-size:12px;color:rgba(255,255,255,.3)">Keine Objekte in dieser Auswahl.</div>'
    : props.map(p=>`
      <div class="prop-item" id="pitem-${p.id}" onclick="selectProp(${p.id})">
        <div class="prop-thumb">${thumbSvg(p.typ)}</div>
        <div class="prop-info">
          <div class="prop-name">${p.name}</div>
          <div class="prop-loc">${p.loc}</div>
          <div class="prop-metrics-row">
            <div class="prop-metric"><strong>${p.sqm} m²</strong></div>
            <div class="prop-metric" style="color:rgba(255,255,255,.25)">·</div>
            <div class="prop-metric"><strong>${p.year}</strong></div>
            <div class="prop-metric" style="color:rgba(255,255,255,.25)">·</div>
            <div class="prop-metric"><strong>${p.h}</strong></div>
          </div>
          <div class="prop-price-row">
            <span class="prop-price">${p.price}</span>
            <span class="prop-delta" style="background:rgba(0,229,200,.08);color:${p.dc}">${p.delta}</span>
          </div>
        </div>
      </div>`).join('');
}

// Render list view grid
function renderListView(props){
  const el = document.getElementById('list-grid');
  el.innerHTML = props.map(p=>`
    <div class="lcard" onclick="selectProp(${p.id})">
      <div class="lcard-img">${thumbSvg(p.typ)}</div>
      <div class="lcard-body">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px">
          <div style="font-size:12px;font-weight:500;flex:1">${p.name}</div>
          ${tagHtml(p.status)}
        </div>
        <div style="font-size:10px;color:rgba(255,255,255,.4);margin-bottom:8px">${p.loc}</div>
        <div style="display:flex;gap:12px">
          <div style="font-size:10px;color:rgba(255,255,255,.5)">Fläche <strong style="color:#fff;display:block;font-size:11px">${p.sqm} m²</strong></div>
          <div style="font-size:10px;color:rgba(255,255,255,.5)">Baujahr <strong style="color:#fff;display:block;font-size:11px">${p.year}</strong></div>
          <div style="font-size:10px;color:rgba(255,255,255,.5)">Höhe <strong style="color:#fff;display:block;font-size:11px">${p.h}</strong></div>
        </div>
      </div>
      <div class="lcard-footer">
        <span style="font-family:'DM Mono',monospace;font-size:13px;color:#00E5C8">${p.price}</span>
        <button class="btn-xs">Exposé</button>
      </div>
    </div>`).join('') + `
    <div class="lcard" style="border-style:dashed;border-color:rgba(0,229,200,.25);cursor:pointer;background:rgba(0,229,200,.03)" onclick="window.location='landingpage_v2_journey.html#pricing'">
      <div style="height:100%;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:10px">
        <div style="width:40px;height:40px;border-radius:50%;background:rgba(0,229,200,.1);border:1px solid rgba(0,229,200,.25);display:flex;align-items:center;justify-content:center;font-size:18px;color:#00E5C8">+</div>
        <div style="font-size:13px;font-weight:500;color:#00E5C8">Ihr Objekt listen</div>
        <div style="font-size:11px;color:rgba(255,255,255,.35)">500 Investoren · 5.000+ Käufer</div>
      </div>
    </div>`;
}

// Select property
function selectProp(id){
  const p = PROPS.find(x=>x.id===id);
  if(!p) return;
  // Pin highlight
  document.querySelectorAll('.mp-pin circle').forEach(c=>{ if(parseInt(c.getAttribute('r'))===7) c.setAttribute('r','5'); });
  const pin = document.getElementById('mp-pin-'+id) || document.getElementById(p.pinId);
  // Sidebar highlight
  document.querySelectorAll('.prop-item').forEach(el=>{el.classList.remove('selected');el.style.borderLeft='';});
  const sRow = document.getElementById('pitem-'+id);
  if(sRow){sRow.classList.add('selected');sRow.scrollIntoView({block:'nearest',behavior:'smooth'});}
  // Detail panel
  document.getElementById('det-name').textContent = p.name;
  document.getElementById('det-loc').textContent = `${p.loc} · ${p.sqm} m²`;
  document.getElementById('det-tag-wrap').innerHTML = tagHtml(p.status);
  document.getElementById('det-price').textContent = p.price;
  document.getElementById('det-sub').textContent = `${p.year} · ${p.h} Hallenhöhe · ${p.delta}`;
  document.getElementById('det-metrics').innerHTML = `
    <div class="dm-cell"><div class="dm-val">${p.sqm} m²</div><div class="dm-lbl">Nutzfläche</div></div>
    <div class="dm-cell"><div class="dm-val">${p.year}</div><div class="dm-lbl">Baujahr</div></div>
    <div class="dm-cell"><div class="dm-val">${p.h}</div><div class="dm-lbl">Hallenhöhe</div></div>
    <div class="dm-cell"><div class="dm-val">${p.typ.charAt(0).toUpperCase()+p.typ.slice(1)}</div><div class="dm-lbl">Typ</div></div>`;
  document.getElementById('detail-panel').classList.add('open');
  activeProp = id;
}

function closeDetail(){
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.prop-item').forEach(el=>{el.classList.remove('selected');el.style.borderLeft='';});
  activeProp = null;
}

// Filter
function filterBy(btn, key, val){
  document.querySelectorAll(`.chip[onclick*="'${key}'"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterState[key] = val;
  applyFilter();
}

function applyFilter(){
  const visible = PROPS.filter(p=>{
    const okT = filterState.typ==='alle'||filterState.typ===p.typ;
    const okP = filterState.preis==='alle'||filterState.preis===p.preis;
    return okT&&okP;
  });
  PROPS.forEach(p=>{
    const pin = document.getElementById(p.pinId);
    if(pin) pin.style.display = visible.find(v=>v.id===p.id)?'':'none';
  });
  document.getElementById('mp-count').textContent = visible.length;
  document.getElementById('sidebar-count').textContent = `${visible.length} Objekte · DE`;
  renderList(visible);
  renderListView(visible);
  closeDetail();
}

// View toggle
function switchView(mode){
  const mapL = document.getElementById('map-layout');
  const listL = document.getElementById('list-view');
  const mb = document.getElementById('btn-map');
  const lb = document.getElementById('btn-list');
  if(mode==='map'){
    mapL.style.display='grid'; listL.classList.remove('active');
    mb.classList.add('active'); lb.classList.remove('active');
  } else {
    mapL.style.display='none'; listL.classList.add('active');
    lb.classList.add('active'); mb.classList.remove('active');
  }
}

// Init
const all = PROPS;
renderList(all);
renderListView(all);
</script>
